name: MESA M1 | Testes sintéticos

# Nenhum gatilho automático: executar manualmente no GitHub.
on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'mesa/m1-3-agent-contract']
    paths:
      - "mesa_sandbox/**"
      - "mesa_lab/**"
      - "fixtures/m1-4/**"
      - "tests/**"
      - "docs/m1-3-protocol.md"
      - "docs/m1-4-proposal-bridge.md"
      - ".github/workflows/m1-synthetic-tests.yml"

permissions:
  contents: read

concurrency:
  group: mesa-m1-synthetic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-tests:
    name: Python sintético — sem dependências
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout sem persistência de credenciais
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Mostrar versão do Python
        run: python3 --version

      - name: Executar testes unitários sem downloads
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Validar proposta de IA inerte e SHA real de main
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m mesa_lab.demo_receipt
